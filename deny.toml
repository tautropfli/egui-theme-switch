[graph]
all-features = true

[output]
feature-depth = 1

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 1.0

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "syn@2", reason = "syn 2 to 3 migration is still ongoing" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
