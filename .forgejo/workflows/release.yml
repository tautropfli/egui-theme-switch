on:
   push:
      tags:
        - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  RUSTDOCFLAGS: -Dwarnings

jobs:
  release:
    name: Release
    runs-on: fedora-latest
    steps:
    - uses: actions/checkout@v7
    - name: Publish
      run: cargo publish
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
